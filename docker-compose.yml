services:
  app:
    build:
      context: .
      target: php
    image: aaglora-pos-app
    container_name: AAglora_app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    volumes:
      - .:/var/www  

  web:
    build:
      context: .
      target: web
    container_name: pos_web
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: pos_db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]   # TIDAK ada "ports": database tidak terbuka ke luar
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: php
    container_name: pos_scheduler
    env_file: .env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata: